# Session lock: authenticate with the current user's system password.
background {
    monitor =
    path = @HOME@/.config/hypr/theme-wallpaper
    color = rgba(030609ff)
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}
label {
    monitor =
    text = $TIME
    color = rgba(d7f3ffff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    outer_color = rgba(155779ff)
    inner_color = rgba(030609ee)
    font_color = rgba(d7f3ffff)
    check_color = rgba(3aa9d2ff)
    fail_color = rgba(e87878ff)
    placeholder_text = Enter password to unlock
    fail_text = Authentication failed
    fade_on_empty = false
    position = 0, -30
    halign = center
    valign = center
}
