# --- Font ---
font_family      monospace
font_size        13.0
disable_ligatures always

# --- Cursor: blocky, no smooth blink ---
cursor_shape       block
cursor_blink_interval 0
cursor_trail       0

# --- Window: sharp edges, no padding fuzz ---
window_padding_width   6
window_border_width    2pt
draw_minimal_borders   no
hide_window_decorations yes

# --- Tabs: flat, blocky look ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   angled
tab_bar_min_tabs      1

# --- Color palette (dark navy / teal / warm yellow) ---
background            #0d1117
foreground            #c9d1d9
cursor                #e3b341
selection_background  #263043

color0  #0d1117
color8  #30363d
color1  #f85149
color9  #ff7b72
color2  #3fb950
color10 #56d364
color3  #e3b341
color11 #f0c674
color4  #58a6ff
color12 #79c0ff
color5  #bc8cff
color13 #d2a8ff
color6  #39c5cf
color14 #56d4dd
color7  #b1bac4
color15 #f0f6fc

active_tab_background   #39c5cf
active_tab_foreground   #0d1117
inactive_tab_background #161b22
inactive_tab_foreground #8b949e

# --- Bell: off, keeps it clean ---
enable_audio_bell no

# --- Transparency ---
