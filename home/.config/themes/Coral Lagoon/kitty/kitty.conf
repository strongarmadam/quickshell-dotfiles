# --- Font ---
font_family      monospace
font_size        13.0
disable_ligatures always

# --- Cursor: blocky, no smooth blink ---
cursor_shape       block
cursor_blink_interval 0
cursor_trail       0

# --- Window: sharp edges, no padding fuzz ---
window_padding_width   12
window_border_width    2pt
draw_minimal_borders   no
hide_window_decorations yes

# --- Tabs: flat, blocky look ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_min_tabs      1

# --- Color palette (dark navy / teal / warm yellow) ---
background            #062b40
foreground            #d5edf7
cursor                #efb957
selection_background  #39526d

color0  #062b40
color8  #206782
color1  #e89db6
color9  #f5bfd0
color2  #51cbb8
color10 #8ce4cf
color3  #efb957
color11 #cfb5ef
color4  #39b9df
color12 #83daf2
color5  #b898df
color13 #dec9f6
color6  #48cadd
color14 #a0e5f0
color7  #aecddf
color15 #f0f9ff

active_tab_background   #efb957
active_tab_foreground   #062b40
inactive_tab_background #0a3d57
inactive_tab_foreground #8b949e

# --- Bell: off, keeps it clean ---
enable_audio_bell no

# --- Transparency ---
