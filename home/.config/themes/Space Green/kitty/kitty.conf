# --- Font ---
font_family      monospace
font_size        13.0
disable_ligatures always

# --- Cursor: blocky, no smooth blink ---
cursor_shape       block
cursor_blink_interval 0
cursor_trail       0

# --- Window: sharp edges, no padding fuzz ---
window_padding_width   6
window_border_width    2pt
draw_minimal_borders   no
hide_window_decorations yes

# --- Tabs: flat, blocky look ---
tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   angled
tab_bar_min_tabs      1

# --- Color palette (dark navy / teal / warm yellow) ---
background            #030609
foreground            #c8e6f3
cursor                #58c7ed
selection_background  #263043

color0  #030609
color8  #164564
color1  #63b5de
color9  #8bc8e6
color2  #3fb950
color10 #56d364
color3  #58c7ed
color11 #8cdef5
color4  #58a6ff
color12 #79c0ff
color5  #519fdb
color13 #b7ddf0
color6  #40c9e3
color14 #56d4dd
color7  #9ebdcc
color15 #e4f7ff

active_tab_background   #40c9e3
active_tab_foreground   #030609
inactive_tab_background #07121d
inactive_tab_foreground #8b949e

# --- Bell: off, keeps it clean ---
enable_audio_bell no

# --- Transparency ---
