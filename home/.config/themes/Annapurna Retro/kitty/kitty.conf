# --- Font ---
font_family      monospace
font_size        13.0
disable_ligatures always

# --- Cursor: blocky, no smooth blink ---
cursor_shape       block
cursor_blink_interval 0
cursor_trail       0

# --- Window: sharp edges, no padding fuzz ---
window_padding_width   6
window_border_width    3pt
draw_minimal_borders   no
hide_window_decorations yes

# --- Tabs: flat, blocky look ---
tab_bar_edge          bottom
tab_bar_style         separator
tab_powerline_style   angled
tab_bar_min_tabs      1

# --- Color palette (dark navy / teal / warm yellow) ---
background            #071e35
foreground            #e2f3ff
cursor                #9bd65b
selection_background  #17465d

color0  #071e35
color8  #35647e
color1  #f85149
color9  #ff7b72
color2  #62b84b
color10 #9bd65b
color3  #9bd65b
color11 #c5ee9a
color4  #45b8ff
color12 #97d7ff
color5  #6ccde4
color13 #b6eafa
color6  #46d6e8
color14 #91e8ef
color7  #cee8f5
color15 #f1faff

active_tab_background   #46d6e8
active_tab_foreground   #071e35
inactive_tab_background #10354d
inactive_tab_foreground #96bed1

# --- Bell: off, keeps it clean ---
enable_audio_bell no

# --- Transparency ---

# White retro window outlines
active_border_color #ffffff
inactive_border_color #ffffff
