# =========================================================
# SPACE GREEN — KITTY
# =========================================================

# --- Font ---
font_family      JetBrainsMono Nerd Font
font_size        13.0
disable_ligatures always

# --- Cursor ---
cursor_shape       block
cursor_blink_interval 0
cursor_trail       0

# --- Window ---
window_padding_width   8
window_border_width    1pt
draw_minimal_borders   yes
hide_window_decorations yes

# --- Tabs ---
tab_bar_edge          bottom
tab_bar_style         separator
tab_powerline_style   angled
tab_bar_min_tabs      1

# --- Space Green palette ---
background            #061a2b
foreground            #e2f3ff
cursor                #c5ee9a
selection_background  #17465d

color0  #061a2b
color8  #35647e

color1  #ff8054
color9  #ff9b73

color2  #4c91b2
color10 #9bd65b

color3  #9bd65b
color11 #c5ee9a

color4  #62b84b
color12 #9bd65b

color5  #4c91b2
color13 #97d7ff

color6  #46d6e8
color14 #91e8ef

color7  #cee8f5
color15 #e2f3ff

active_tab_background   #9bd65b
active_tab_foreground   #071e35
inactive_tab_background #10354d
inactive_tab_foreground #96bed1

# --- Bell ---
enable_audio_bell no

# --- Transparency ---
background_opacity    0.88
dynamic_background_opacity yes

# White retro window outlines
active_border_color #ffffff
inactive_border_color #ffffff
