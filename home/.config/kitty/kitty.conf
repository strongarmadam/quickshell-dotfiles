# Theme-controlled Kitty configuration
include ~/.config/themes/current/kitty/kitty.conf

# Shared transparency across all desktop themes
include ~/.config/kitty/glass.conf

font_size 13.0

# Ask before closing windows containing running jobs.
confirm_os_window_close -1

# Optional per-theme overrides from Theme Creator, after shared defaults.
globinclude ../themes/current/kitty/creator-overrides.conf
